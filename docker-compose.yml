version: "3.9"

services:
  # ─── Backend API ────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chess_api
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      CLIENT_URL: ${CLIENT_URL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_TOKEN_SECRET}
      JWT_ACCESS_TOKEN_EXPIRES_IN: ${JWT_ACCESS_TOKEN_EXPIRES_IN}
      JWT_REFRESH_TOKEN_SECRET: ${JWT_REFRESH_TOKEN_SECRET}
      JWT_REFRESH_TOKEN_EXPIRES_IN: ${JWT_REFRESH_TOKEN_EXPIRES_IN}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX}
      API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX}
      HISTORY_RATE_LIMIT_WINDOW_MS: ${HISTORY_RATE_LIMIT_WINDOW_MS}
      HISTORY_RATE_LIMIT_MAX: ${HISTORY_RATE_LIMIT_MAX}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - chess_network
    restart: unless-stopped
    volumes:
      - ./src:/app/src # hot reload khi sửa code
      - /app/node_modules # giữ node_modules trong container

  # ─── MySQL ──────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: chess_mysql
    ports:
      - "3307:3306" # dùng 3307 để không đụng MySQL local 
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    restart: always
    networks:
      - chess_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: chess_phpmyadmin
    depends_on:
      - mysql
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 500M
    networks:
      - chess_network
    # ─── Volumes ─────────────────────────────────────────────
volumes:
  chess_mysql_data:
    name: chess_mysql_data # tên cố định, dễ nhận biết

networks:
  chess_network:
    name: chess_network
    driver: bridge

# ─── Lệnh thường dùng ────────────────────────────────────
# Khởi động tất cả:
#   docker-compose up -d --build
#
# Xem log backend:
#   docker-compose logs -f api
#
# Tắt tất cả:
#   docker-compose down
#
# Rebuild sau khi thêm package mới:
#   docker-compose up -d --build api
